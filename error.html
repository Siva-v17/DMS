<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found | Stackly Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-2:    #FFFFFF;
    --mist:     #F1EEFB;
    --mist-2:   #E7E1F6;
    --paper:    #F8F6F1;
    --paper-2:  #EFEBFA;

    --manila:   #4F46E5;
    --manila-2: #6D5EF5;
    --indigo:   #4F46E5;
    --indigo-2: #6D5EF5;
    --on-accent:#FFFFFF;

    --ink:      #1B1830;
    --ink-soft: #5B5878;
    --line:     #E1DCF3;

    --font-head: 'Sora', sans-serif;
    --font-body: 'Manrope', sans-serif;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    height:100%;
    font-family: var(--font-body);
    background: var(--paper);
    color: var(--ink);
    overflow-x:hidden;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    position:relative;
    padding:24px;
  }

  /* ---------- ambient background ---------- */
  .bg-grid{
    position:fixed;
    inset:0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 56px 56px;
    opacity:.45;
    mask-image: radial-gradient(circle at center, black 0%, transparent 72%);
    -webkit-mask-image: radial-gradient(circle at center, black 0%, transparent 72%);
    pointer-events:none;
  }

  .glow{
    position:fixed;
    width:640px;
    height:640px;
    border-radius:50%;
    background: radial-gradient(circle, rgba(79,70,229,0.16) 0%, rgba(109,94,245,0.06) 45%, transparent 72%);
    filter: blur(10px);
    pointer-events:none;
    z-index:0;
  }
  .glow-a{ top:-220px; left:-200px; }
  .glow-b{ bottom:-260px; right:-220px; background: radial-gradient(circle, rgba(109,94,245,0.14) 0%, transparent 70%); }

  .float-doc{
    position:fixed;
    z-index:0;
    opacity:0;
    color: var(--manila);
    pointer-events:none;
  }

  /* ---------- card ---------- */
  .wrap{
    position:relative;
    z-index:2;
    width:100%;
    max-width:620px;
    text-align:center;
  }

  .logo-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-bottom:44px;
    opacity:0;
  }

  .logo-mark{
    width:34px;
    height:34px;
    border-radius:9px;
    background: linear-gradient(135deg, var(--manila), var(--manila-2));
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow: 0 8px 20px -8px rgba(79,70,229,0.55);
  }
  .logo-mark svg{ width:18px; height:18px; }

  .logo-word{
    font-family: var(--font-head);
    font-weight:700;
    font-size:1.05rem;
    letter-spacing:-0.01em;
    color: var(--ink);
  }
  .logo-word span{ color: var(--manila); }

  .stage{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:8px;
  }

  .vault-icon{
    position:relative;
    width:132px;
    height:132px;
    border-radius:32px;
    background: var(--ink-2);
    border:1px solid var(--mist-2);
    box-shadow:
      0 2px 0 var(--mist-2),
      0 24px 48px -20px rgba(79,70,229,0.28);
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    transform: scale(0.85);
  }

  .vault-icon::before{
    content:'';
    position:absolute;
    inset:10px;
    border-radius:24px;
    border:1.5px dashed var(--mist-2);
  }

  .vault-icon svg{ width:56px; height:56px; position:relative; z-index:1; }

  .dial{
    stroke: var(--manila);
    transform-origin: 66px 66px;
  }

  .num-404{
    font-family: var(--font-head);
    font-weight:800;
    font-size: clamp(4.5rem, 14vw, 7.5rem);
    line-height:1;
    letter-spacing:-0.03em;
    background: linear-gradient(180deg, var(--ink) 0%, var(--indigo-2) 120%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    position:absolute;
    opacity:0.07;
    z-index:0;
    user-select:none;
    white-space:nowrap;
  }

  h1{
    font-family: var(--font-head);
    font-weight:800;
    font-size: clamp(1.6rem, 3.4vw, 2.1rem);
    letter-spacing:-0.02em;
    margin: 30px 0 14px;
    opacity:0;
  }

  p.lead{
    color: var(--ink-soft);
    font-size:1.02rem;
    line-height:1.65;
    max-width:460px;
    margin:0 auto 8px;
    opacity:0;
  }

  .path-chip{
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin:22px auto 36px;
    padding:9px 16px;
    background: var(--mist);
    border:1px solid var(--mist-2);
    border-radius:100px;
    font-size:0.86rem;
    color: var(--ink-soft);
    font-weight:600;
    opacity:0;
  }
  .path-chip svg{ width:14px; height:14px; flex-shrink:0; color: var(--manila); }
  .path-chip code{
    font-family: 'SFMono-Regular', Consolas, monospace;
    color: var(--ink);
    font-weight:700;
  }

  .actions{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    flex-wrap:wrap;
    opacity:0;
  }

  .btn{
    display:inline-flex;
    align-items:center;
    gap:9px;
    padding:14px 26px;
    border-radius:12px;
    font-family: var(--font-body);
    font-weight:700;
    font-size:0.96rem;
    cursor:pointer;
    border:1px solid transparent;
    text-decoration:none;
    transition: transform .25s ease, box-shadow .25s ease, background .25s ease, border-color .25s ease;
    position:relative;
    overflow:hidden;
  }
  .btn svg{ width:18px; height:18px; position:relative; z-index:1; }
  .btn span{ position:relative; z-index:1; }

  .btn-primary{
    background: linear-gradient(135deg, var(--manila), var(--manila-2));
    color: var(--on-accent);
    box-shadow: 0 14px 30px -12px rgba(79,70,229,0.55);
  }
  .btn-primary:hover{
    transform: translateY(-2px);
    box-shadow: 0 18px 36px -12px rgba(79,70,229,0.65);
  }
  .btn-primary:active{ transform: translateY(0); }

  .btn-ghost{
    background: var(--ink-2);
    color: var(--ink);
    border-color: var(--mist-2);
  }
  .btn-ghost:hover{
    border-color: var(--manila);
    color: var(--manila);
    transform: translateY(-2px);
    box-shadow: 0 10px 24px -14px rgba(27,24,48,0.2);
  }
  .btn-ghost:active{ transform: translateY(0); }

  .foot-note{
    margin-top:40px;
    font-size:0.84rem;
    color: var(--ink-soft);
    opacity:0;
  }
  .foot-note a{
    color: var(--manila);
    font-weight:700;
    text-decoration:none;
  }
  .foot-note a:hover{ text-decoration:underline; }

  @media (max-width:480px){
    .actions{ flex-direction:column; width:100%; }
    .btn{ width:100%; justify-content:center; }
    .vault-icon{ width:108px; height:108px; border-radius:26px; }
    .vault-icon svg{ width:46px; height:46px; }
  }
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="glow glow-a"></div>
<div class="glow glow-b"></div>

<div class="wrap">

  <div class="logo-row" id="logoRow">
    <div class="logo-mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 6C4 4.89543 4.89543 4 6 4H14L20 10V18C20 19.1046 19.1046 20 18 20H6C4.89543 20 4 19.1046 4 18V6Z" stroke="#FFFFFF" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M14 4V10H20" stroke="#FFFFFF" stroke-width="1.8" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="logo-word">Stackly<span>Vault</span></div>
  </div>

  <div class="stage">
    <div class="num-404" id="num404">404</div>
    <div class="vault-icon" id="vaultIcon">
      <svg viewBox="0 0 132 132" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="66" cy="66" r="34" stroke="var(--mist-2)" stroke-width="4"/>
        <g class="dial" id="dial">
          <circle cx="66" cy="66" r="34" stroke="var(--manila)" stroke-width="4" stroke-dasharray="18 12" stroke-linecap="round"/>
          <circle cx="66" cy="32" r="4.5" fill="var(--manila)"/>
        </g>
        <rect x="52" y="60" width="28" height="20" rx="4" fill="var(--manila)"/>
        <path d="M58 60V52C58 47.5817 61.5817 44 66 44C70.4183 44 74 47.5817 74 52V60" stroke="var(--manila)" stroke-width="4" stroke-linecap="round"/>
        <circle cx="66" cy="69" r="2.6" fill="#FFFFFF"/>
      </svg>
    </div>
  </div>

  <h1 id="heading">This document couldn't be located</h1>
  <p class="lead" id="lead">The page you're looking for may have been moved, renamed, or never existed in this vault. Let's get you back to safety.</p>

  <div class="path-chip" id="chip">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M9 6L15 12L9 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>Error code</span>
    <code>404_NOT_FOUND</code>
  </div>

  <div class="actions" id="actions">
    <button class="btn btn-ghost" id="backBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Go Back</span>
    </button>
    <a class="btn btn-primary" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 10.5L12 4L21 10.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M5 9.5V19C5 19.5523 5.44772 20 6 20H9.5V15C9.5 14.4477 9.94772 14 10.5 14H13.5C14.0523 14 14.5 14.4477 14.5 15V20H18C18.5523 20 19 19.5523 19 19V9.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Return to Homepage</span>
    </a>
  </div>

  <p class="foot-note">Still stuck? <a href="contact.html">Contact support</a></p>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
  document.getElementById('backBtn').addEventListener('click', function(){
    if (window.history.length > 1) {
      window.history.back();
    } else {
      window.location.href = 'index.html';
    }
  });

  window.addEventListener('DOMContentLoaded', function(){
    if (typeof gsap === 'undefined') return;

    const tl = gsap.timeline({ defaults:{ ease:'power3.out' } });

    tl.to('#logoRow', { opacity:1, y:0, duration:.6 }, 0)
      .from('#logoRow', { y:-14, duration:.6 }, 0)
      .to('#num404', { opacity:0.07, duration:1.1 }, 0.05)
      .from('#num404', { scale:0.8, duration:1.1 }, 0.05)
      .to('#vaultIcon', { opacity:1, scale:1, duration:.8, ease:'back.out(1.6)' }, 0.15)
      .to('#heading', { opacity:1, y:0, duration:.7 }, 0.4)
      .from('#heading', { y:16, duration:.7 }, 0.4)
      .to('#lead', { opacity:1, y:0, duration:.7 }, 0.52)
      .from('#lead', { y:14, duration:.7 }, 0.52)
      .to('#chip', { opacity:1, y:0, duration:.6 }, 0.62)
      .from('#chip', { y:10, duration:.6 }, 0.62)
      .to('#actions', { opacity:1, y:0, duration:.6 }, 0.72)
      .from('#actions', { y:14, duration:.6 }, 0.72)
      .to('.foot-note', { opacity:1, duration:.6 }, 0.9);

    gsap.to('#dial', {
      rotation: 360,
      duration: 8,
      repeat: -1,
      ease: 'none',
      transformOrigin: '66px 66px'
    });

    gsap.to('.glow-a', { x: 30, y: 20, duration: 8, yoyo:true, repeat:-1, ease:'sine.inOut' });
    gsap.to('.glow-b', { x: -30, y: -20, duration: 9, yoyo:true, repeat:-1, ease:'sine.inOut' });
  });
</script>
</body>
</html>
